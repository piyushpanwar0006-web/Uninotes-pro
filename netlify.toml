[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# nft (Node File Tracing) traces only the files actually used at runtime,
# producing smaller Lambda bundles → faster cold starts.
[functions]
  node_bundler = "nft"

[build.environment]
  # Disables Next.js telemetry pings that add latency during build
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
